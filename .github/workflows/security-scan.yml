name: Security Scan

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: "0 0 * * 1"

jobs:
  trivy-scan:
    name: Container Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Get commit SHA
        id: commit
        run: |
          echo "build-date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT
          echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "version=$(cat ${GITHUB_WORKSPACE}/VERSION)" >> $GITHUB_OUTPUT
          echo "dest-image=omni-api-scan-image-$(git rev-parse --short HEAD).tar" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build container for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        env:
          COMMIT_BUILD_DATE: ${{ steps.commit.outputs.build-date }}
          COMMIT_SHA: ${{ steps.commit.outputs.sha }}
          COMMIT_VERSION: ${{ steps.commit.outputs.version }}
          DEST_IMAGE: ${{ steps.commit.outputs.dest-image }}
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64, linux/arm64
          push: false
          tags: omni-api:scan
          outputs: type=local,dest=./${{ env.DEST_IMAGE }}
          labels: |
            org.opencontainers.image.title="Omni API"
            org.opencontainers.image.description="A REST API to interface with Sidero Omni"
            org.opencontainers.image.version=${{ env.COMMIT_VERSION }}
            org.opencontainers.image.created=${{ env.COMMIT_BUILD_DATE }}
            org.opencontainers.image.revision=${{ env.COMMIT_SHA }}
            org.opencontainers.image.source=https://github.com/Jubblin/omni-api
            org.opencontainers.image.licenses="MIT"
          build-args: |
            BUILD_DATE=${{ env.COMMIT_BUILD_DATE }}
            SHA=${{ env.COMMIT_SHA }}
            VERSION=${{ env.COMMIT_VERSION }}

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@2736533278103862a861f4a35ebac3e97854d956 # master
        env:
          DEST_IMAGE: ${{ steps.commit.outputs.dest-image }}
        with:
          input: ./${{ steps.commit.outputs.dest-image }}
          # image-ref: omni-api:scan
          format: "sarif"
          exit-code: "0"
          output: "trivy-results.sarif"
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4
        if: always()
        with:
          sarif_file: "trivy-results.sarif"
